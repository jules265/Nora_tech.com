<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nora Tech - Register</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <header>
        <h1>Nora-Tech</h1>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="new-arrival.html">New Arrivals</a></li>
                <li><a href="building.html">Building</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>
    <form id="register-form">
        <input type="text" id="reg-name" placeholder="Full Name" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Password" required>
        <button type="submit">Register</button>
    </form>
    
    <script>
        document.getElementById('register-form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            // Get form data
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
    
            // Create user object
            const newUser = {
                name,
                email,
                password, // In production, store passwords securely (hashed)
                joinDate: new Date().toISOString(),
                orderCount: 0, // Default order count
            };
    
            // Retrieve existing users or initialize an empty array
            const users = JSON.parse(localStorage.getItem('users')) || [];
    
            // Add new user to the array
            users.push(newUser);
    
            // Save updated users array to local storage
            localStorage.setItem('users', JSON.stringify(users));
    
            // Clear the form
            document.getElementById('register-form').reset();
    
            // Optionally, alert user that registration is successful
            alert('Registration successful!');
            window.location.href = 'login.html';
        });
    </script>
    
</body>
</html>
