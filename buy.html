<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Now - Nora Tech</title>
    <style>
        /* Styles from your buy.css */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem;
        }
        .menu {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        .menu a {
            color: white;
            text-decoration: none;
        }
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .product-image {
            max-width: 100%;
            height: auto;
        }
        .contact-form form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        input, textarea {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button, input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Nora Tech - Buy Now</h1>
        <nav>
            <ul class="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="cart.html">Cart 🛒</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="main-content">
            <div class="product-details">
                <img id="product-image" src="" alt="Product Image" class="product-image">
                <h2 id="product-name">Product: </h2>
                <p id="product-description">Product description goes here...</p>
                <p class="price" id="product-price">Price: </p>
            </div>

            <div class="contact-form">
                <h3>Enter Your Details</h3>
                <form id="order-form">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>

                    <label for="phone">Phone:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Your Phone" required>

                    <label for="address">Address:</label>
                    <textarea id="address" name="address" placeholder="Your Address" rows="5" required></textarea>

                    <input type="submit" value="Place Order">
                </form>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2025 Nora Tech. | All Rights Reserved | Designed by <a href="indexx.html">Jules-Dev</a>
    </footer>

    <script>
        // Get product details from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const productName = urlParams.get('product');
        const productPrice = urlParams.get('price');
        const productImage = urlParams.get('image');
        const productDescription = urlParams.get('description');

        // Update product details in the page
        document.getElementById("product-name").textContent = `Product: ${productName}`;
        document.getElementById("product-description").textContent = productDescription || "No description available";
        document.getElementById("product-price").textContent = `Price: $${productPrice}`;
        document.getElementById("product-image").src = productImage || 'default-image.jpg';

        // Handle form submission
        document.getElementById("order-form").addEventListener("submit", function(event) {
            event.preventDefault();

            // Get form values
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const address = document.getElementById("address").value.trim();

            if (!name || !email || !phone || !address) {
                alert("Please fill in all fields.");
                return;
            }

            // Create order object
            const order = {
                name: productName,
                price: productPrice,
                image: productImage,
                quantity: 1,
                customerName: name,
                customerEmail: email,
                customerPhone: phone,
                customerAddress: address,
                orderDate: new Date().toISOString()
            };

            // Update purchased products for admin dashboard
            const purchasedProducts = JSON.parse(localStorage.getItem("purchasedProducts")) || [];
            const existingProductIndex = purchasedProducts.findIndex(p => p.name === productName);

            if (existingProductIndex !== -1) {
                purchasedProducts[existingProductIndex].quantity += 1;
            } else {
                purchasedProducts.push({
                    name: productName,
                    price: productPrice,
                    image: productImage,
                    quantity: 1
                });
            }

            // Save to localStorage
            localStorage.setItem("purchasedProducts", JSON.stringify(purchasedProducts));

            // Save order details
            const orders = JSON.parse(localStorage.getItem("orders")) || [];
            orders.push(order);
            localStorage.setItem("orders", JSON.stringify(orders));

            // Show success message and redirect
            alert("Order placed successfully! Thank you for your purchase.");
            window.location.href = "index.html";
        });
    </script>
</body>
</html>
