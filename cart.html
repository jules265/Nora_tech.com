    <script>
        let cart = JSON.parse(localStorage.getItem('cart')) || [];

        };
    
        function updateCart() {
            const cartItemsDiv = document.getElementById("cart-items");
            const totalItems = document.getElementById("total-items");
            const totalPrice = document.getElementById("total-price");
            let total = 0;
    
            cartItemsDiv.innerHTML = ""; // Clear the cart items list
    
            cart.forEach(item => {
                const cartItem = document.createElement("div");
                cartItem.classList.add("cart-item");
                cartItem.innerHTML = `
                    <div class="cart-item-image" style="background-image: url(${productImages[item.name] || 'default.jpg'});"></div>
                    <p>${item.name} - $${item.price}</p>
                    <button onclick="removeFromCart('${item.name}')">Remove</button>&nbsp;
                    <button onclick="buyNow('${item.name}', ${item.price}, '${productImages[item.name]}')" style="background-color: orange;">Buy Now</button>
                `;
                cartItemsDiv.appendChild(cartItem);
                total += item.price;
            });
    
            totalItems.textContent = cart.length;
            totalPrice.textContent = `$${total.toFixed(2)}`;
        }
    
        function removeFromCart(productName) {
            cart = cart.filter(item => item.name !== productName);  // Remove the item
            localStorage.setItem('cart', JSON.stringify(cart));  // Update localStorage
            updateCart();
        }
    
        function buyNow(productName, productPrice, productImage) {
            // Redirect to the "Buy Now" page with product details
            const productDescription = getProductDescription(productName);
            window.location.href = `buy.html?product=${productName}&price=${productPrice}&image=${productImage}&description=${productDescription}`;
        }
    
        function getProductDescription(productName) {
            const descriptions = {
                'Laptop': 'High performance laptop with the latest technology.',
                'Smartphone': 'Latest model with great camera and performance.',
                'Headphones': 'Noise-cancelling headphones with superior sound quality.',
                'Smartwatch': 'Stylish smartwatch with fitness tracking features.',
                'Keyboard': 'Mechanical keyboard for optimal typing experience.',
                'Hp-Laptop': 'High performance Hp-Laptop with the latest technology.',
                'Virual_Reality': 'High performance Virtual-Reality with the latest technology.',
                'Tablet': 'High performance Tablet with the latest technology.',
                'Television': 'High performance Television with the latest technology.',
                'Handler': 'High performance Handler with the latest technology.',
                'Projector': 'High performance Projector with the latest technology.',
                'Macos': 'High performance Macos with the latest technology.',
                'Ipad': 'High performance Ipad with the latest technology.',
                'Infinix': 'High performance Infinx with the latest technology.',
                'Canon': 'High performance Canon with the latest technology.',
                'Nikon': 'High performance Nikon with the latest technology.',
                'Canon-EOS-Rebel-T7i': 'High performance Canon-EOS-Rebel-t7i with the latest technology.',
                'Nikon D7500': 'High performance Nikon D7500 with the latest technology.',
                'Sony A7 III': 'High performance Sony A7 III with the latest technology.',
                'Panasonic Lumix GH5': 'High performance Panasonic Lumix GH5 with the latest technology.',
                'Canon PowerShot G7 X Mark III': 'High performance Canon PowerShot G7 X Mark III with the latest technology.',
                'GoPro MAX': 'High performance GoPro MAX with the latest technology.',
                'Mouse': 'High performance Mouse with the latest technology.',
                'Wireless Mouse': 'High performance Wireless Mouse with the latest technology.',
            };
            return descriptions[productName] || 'No description available';
        }
    
        window.onload = updateCart;
    </script>
