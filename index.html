<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nora_tech - Modern Tech Solutions</title>
    <style>
        :root {
            --primary: #2563eb;
            --secondary: #3b82f6;
            --accent: #60a5fa;
            --background: #0f172a;
            --text: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--background);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, rgba(37, 99, 235, 0.1) 0%, transparent 70%);
        }

        .tech-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(96, 165, 250, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(96, 165, 250, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            perspective: 1000px;
            transform-style: preserve-3d;
            animation: gridRotate 60s linear infinite;
        }

        .particles-container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }

        .logo {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 800;
            background: linear-gradient(135deg, var(--text) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.5rem;
            letter-spacing: -0.02em;
            filter: drop-shadow(0 0 30px rgba(37, 99, 235, 0.3));
        }

        .tagline {
            font-size: clamp(1rem, 3vw, 1.25rem);
            color: var(--accent);
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .cta-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cta-button {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .primary-cta {
            background: var(--primary);
            color: white;
            border: none;
        }

        .secondary-cta {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.2);
        }

        .tech-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        .floating-icons {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .tech-icon {
            position: absolute;
            font-size: 1.5rem;
            color: var(--accent);
            opacity: 0.1;
            animation: float 10s infinite;
        }

        @keyframes gridRotate {
            0% {
                transform: perspective(1000px) rotateX(60deg) translateZ(-100px);
            }
            100% {
                transform: perspective(1000px) rotateX(60deg) translateZ(100px);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        .mouse-trailer {
            position: fixed;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
            mix-blend-mode: screen;
            z-index: 9999;
            transition: transform 0.2s ease;
        }

        @media (max-width: 768px) {
            .cta-container {
                flex-direction: column;
                padding: 0 2rem;
            }
            
            .tech-grid {
                background-size: 20px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <div class="tech-grid"></div>
        <div class="particles-container"></div>
        <div class="floating-icons"></div>
        <div class="content">
            <h1 class="logo">Nora_tech-Company</h1>
            <p class="tagline">Empowering Innovation Through Technology</p>
            <div class="cta-container">
                <a href="home.html" class="cta-button primary-cta">Explore Solutions</a>
                <a href="register.html" class="cta-button secondary-cta">Get in Touch</a>
            </div>
        </div>
    </div>
    <div class="mouse-trailer"></div>

    <script>
        // Mouse trailer effect
        const mouseTrailer = document.querySelector('.mouse-trailer');
        let mouseX = 0, mouseY = 0;
        let trailerX = 0, trailerY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            // Create particle on mouse move
            if (Math.random() > 0.8) {
                createParticle(e.clientX, e.clientY);
            }
        });

        function animate() {
            let dx = mouseX - trailerX;
            let dy = mouseY - trailerY;
            
            trailerX += dx * 0.1;
            trailerY += dy * 0.1;
            
            mouseTrailer.style.transform = `translate(${trailerX}px, ${trailerY}px)`;
            
            requestAnimationFrame(animate);
        }
        animate();

        // Particle effect
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'tech-particle';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            document.querySelector('.particles-container').appendChild(particle);
            
            // Animate particle
            requestAnimationFrame(() => {
                particle.style.opacity = '0.5';
                particle.style.transform = `
                    translate(
                        ${(Math.random() - 0.5) * 100}px,
                        ${(Math.random() - 0.5) * 100}px
                    )
                `;
            });
            
            setTimeout(() => particle.remove(), 1000);
        }

        // Floating tech icons
        const techIcons = ['⚡', '💻', '🔧', '🚀', '⚙️', '📱', '🛹','🛵','⌚','🏗', '🚲', '👷‍♂️','🚋'];
        function createFloatingIcons() {
            const container = document.querySelector('.floating-icons');
            
            for (let i = 0; i < 20; i++) {
                const icon = document.createElement('div');
                icon.className = 'tech-icon';
                icon.textContent = techIcons[Math.floor(Math.random() * techIcons.length)];
                
                icon.style.left = `${Math.random() * 100}%`;
                icon.style.top = `${Math.random() * 100}%`;
                icon.style.animationDelay = `${Math.random() * 5}s`;
                
                container.appendChild(icon);
            }
        }
        createFloatingIcons();

        // Button hover effects
        document.querySelectorAll('.cta-button').forEach(button => {
            button.addEventListener('mouseover', () => {
                createParticle(
                    button.getBoundingClientRect().left + button.offsetWidth / 2,
                    button.getBoundingClientRect().top + button.offsetHeight / 2
                );
            });
        });
    </script>
</body>
</html>
