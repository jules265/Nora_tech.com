<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensional Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #000;
            overflow: hidden;
        }

        .dimension-container {
            position: fixed;
            width: 100%;
            height: 100vh;
            perspective: 1000px;
            background: linear-gradient(45deg, #000000, #1a1a1a);
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotateDimension 100s linear infinite;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        .portal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: conic-gradient(
                from 0deg,
                #6600ff,
                #ff00ff,
                #00ffff,
                #6600ff
            );
            animation: portalSpin 8s linear infinite;
            box-shadow: 0 0 50px rgba(102, 0, 255, 0.5),
                        inset 0 0 50px rgba(255, 0, 255, 0.5);
        }

        .portal::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: #000;
            z-index: 1;
        }

        .dimension-rings {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotateX(75deg);
            width: 800px;
            height: 800px;
        }

        .ring {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.295);
            border-radius: 50%;
            animation: expandRing 4s ease-out infinite;
        }

        @keyframes rotateDimension {
            0% {
                transform: rotateZ(0deg);
            }
            100% {
                transform: rotateZ(360deg);
            }
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.2;
            }
        }

        @keyframes portalSpin {
            0% {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            100% {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        @keyframes expandRing {
            0% {
                width: 0;
                height: 0;
                opacity: 0;
            }
            100% {
                width: 100%;
                height: 100%;
                opacity: 1;
            }
        }

        .content {
            position: relative;
            z-index: 2;
            color: white;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            text-shadow: 0 0 10px rgba(102, 0, 255, 0.8);
        }

        p {
            font-size: 1.2rem;
            max-width: 600px;
            line-height: 1.6;
            text-shadow: 0 0 5px rgba(255, 0, 255, 0.8);
        }
    </style>
</head>
<body>
    <div class="dimension-container">
        <div class="stars"></div>
        <div class="portal"></div>
        <div class="dimension-rings"></div>
        <div class="content">
            <h1>Dimensional Gateway</h1>
            <p>Journey through the cosmic portal into infinite dimensions</p>
        </div>
    </div>f

    <script>
        // Create stars
        const stars = document.querySelector('.stars');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 4 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            stars.appendChild(star);
        }

        // Create dimension rings
        const rings = document.querySelector('.dimension-rings');
        for (let i = 0; i < 20; i++) {
            const ring = document.createElement('div');
            ring.className = 'ring';
            ring.style.animationDelay = i * 0.2 + 's';
            rings.appendChild(ring);
        }

        // Add mouse movement effect
        document.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX / window.innerWidth - 0.5;
            const mouseY = e.clientY / window.innerHeight - 0.5;
            
            const portal = document.querySelector('.portal');
            const rings = document.querySelector('.dimension-rings');
            
            portal.style.transform = `
                translate(-50%, -50%)
                rotateX(${mouseY * 20}deg)
                rotateY(${mouseX * 20}deg)
            `;
            
            rings.style.transform = `
                translate(-50%, -50%)
                rotateX(${75 + mouseY * 10}deg)
                rotateY(${mouseX * 10}deg)
            `;
        });
    </script>
</body>
</html>
