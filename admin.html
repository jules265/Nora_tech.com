<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }
        canvas {
            width: 100% !important;
            max-height: 400px;
        }
        .remove-btn {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Dashboard</h2>
        
        <h3>Purchased Products</h3>
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="purchasedProducts"></tbody>
        </table>
        
        <h3>Most Ordered Products</h3>
        <canvas id="ordersChart"></canvas>
    </div>
    
    <script>
        function updateAdminDashboard() {
            const purchasedProductsTable = document.getElementById("purchasedProducts");
            const purchasedProducts = JSON.parse(localStorage.getItem("purchasedProducts")) || [];
            
            purchasedProductsTable.innerHTML = "";
            purchasedProducts.forEach((product, index) => {
                let imageUrl = product.image ? product.image : 'default-image.jpg'; // Fallback image
                let row = `<tr>
                    <td><img src="${imageUrl}" alt="${product.name}"></td>
                    <td>${product.name}</td>
                    <td>${product.quantity}</td>
                    <td>$${product.price}</td>
                    <td><button class="remove-btn" onclick="removeProduct(${index})">Remove</button></td>
                </tr>`;
                purchasedProductsTable.innerHTML += row;
            });

            updateChart(purchasedProducts);
        }

        function updateChart(products) {
            const ctx = document.getElementById('ordersChart').getContext('2d');
            const labels = products.map(p => p.name);
            const data = products.map(p => p.quantity);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Orders',
                        data: data,
                        backgroundColor: ['red', 'blue', 'green'],
                        borderColor: ['black', 'black', 'black'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function removeProduct(index) {
            let purchasedProducts = JSON.parse(localStorage.getItem("purchasedProducts")) || [];
            purchasedProducts.splice(index, 1);
            localStorage.setItem("purchasedProducts", JSON.stringify(purchasedProducts));
            updateAdminDashboard();
        }

        window.onload = updateAdminDashboard;
    </script>
</body>
</html>
