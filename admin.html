<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            margin: 0;
        }
        .sidebar {
            width: 250px;
            background: #333;
            color: white;
            padding: 20px;
            height: 100vh;
        }
        .sidebar h2 {
            text-align: center;
        }
        .main-content {
            flex: 1;
            padding: 20px;
        }
        .card {
            background: #f4f4f4;
            padding: 20px;
            margin: 10px 0;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background: #555;
            color: white;
        }
        .product-image {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <ul>
            <li>Dashboard</li>
            <li>Orders</li>
            <li>Users</li>
            <li>Settings</li>
        </ul>
    </div>
    <div class="main-content">
        <h1>Dashboard</h1>
        <div class="card">
            <h3>Total Users: <span id="userCount">0</span></h3>
        </div>
        <h2>Recent Orders</h2>
        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Product</th>
                    <th>Image</th>
                    <th>Quantity</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="ordersTable">
            </tbody>
        </table>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            const users = 120;

            document.getElementById("userCount").textContent = users;
            const tableBody = document.getElementById("ordersTable");

            if (cart.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5">No orders found</td></tr>';
                return;
            }

            cart.forEach((item, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td>${item.name}</td>
                    <td><img src="${item.imageUrl}" alt="${item.name}" class="product-image"></td>
                    <td>1</td>
                    <td>Pending</td>
                `;
                tableBody.appendChild(row);
            });
        });

    
    document.addEventListener("DOMContentLoaded", function() {
        const orders = JSON.parse(localStorage.getItem('orders')) || [];
        const tableBody = document.getElementById("ordersTable");

        if (orders.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="5">No orders found</td></tr>';
            return;
        }

        orders.forEach((order, index) => {
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${order.name}</td>
                <td><img src="${order.imageUrl}" alt="${order.name}" class="product-image"></td>
                <td>1</td>
                <td>Pending</td>
            `;
            tableBody.appendChild(row);
        });
    });


    </script>
</body>
</html>
