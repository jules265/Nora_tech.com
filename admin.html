<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        h2 {
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 10px;
            text-align: left;
        }
        canvas {
            width: 100% !important;
            max-height: 400px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Admin Dashboard</h2>
        
        <h3>Purchased Products</h3>
        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody id="purchasedProducts"></tbody>
        </table>
        
        <h3>Most Ordered Products</h3>
        <canvas id="ordersChart"></canvas>
    </div>
    
    <script>
        function updateAdminDashboard() {
            const purchasedProductsTable = document.getElementById("purchasedProducts");
            const purchasedProducts = JSON.parse(localStorage.getItem("purchasedProducts")) || [];
            
            purchasedProductsTable.innerHTML = "";
            purchasedProducts.forEach(product => {
                let row = `<tr>
                    <td>${product.name}</td>
                    <td>${product.quantity}</td>
                    <td>$${product.price}</td>
                </tr>`;
                purchasedProductsTable.innerHTML += row;
            });

            updateChart(purchasedProducts);
        }

        function updateChart(products) {
            const ctx = document.getElementById('ordersChart').getContext('2d');
            const labels = products.map(p => p.name);
            const data = products.map(p => p.quantity);
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Orders',
                        data: data,
                        backgroundColor: ['red', 'blue', 'green'],
                        borderColor: ['black', 'black', 'black'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        window.onload = updateAdminDashboard;

        // Buy Now functionality added from the buy page
        document.getElementById("buy-now-btn")?.addEventListener("click", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productName = urlParams.get('product');
            const productPrice = urlParams.get('price');
            
            if (!productName || !productPrice) return;
            
            const purchasedProducts = JSON.parse(localStorage.getItem("purchasedProducts")) || [];
            const existingProduct = purchasedProducts.find(p => p.name === productName);

            if (existingProduct) {
                existingProduct.quantity += 1;
            } else {
                purchasedProducts.push({ name: productName, quantity: 1, price: productPrice });
            }

            localStorage.setItem("purchasedProducts", JSON.stringify(purchasedProducts));
            alert(`You have purchased ${productName} for $${productPrice}`);
            updateAdminDashboard();
        });
    </script>
</body>
</html>
