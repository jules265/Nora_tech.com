<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }
        h3{
            
          padding: 20px 30px;
        
        }
        .contact-form input, .contact-form textarea {
            width: 97%;
            padding: 10px;
            margin: 10px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .contact-form{
            width: 98%;
            background-color: #fff;
        }
        label{
            padding: 5px 10px;
        }
        .contact-form input:focus{
            box-shadow: 0 0 4px blue;
            outline: none;
            border:1px solid blue;
        }
        .contact-form textarea{
            outline: #218838;
        }
        .send {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }
        .send:hover{
            background-color: #2faf4b;
        }
    </style>
    <script>
        
        async function handleContactForm(event) {
            event.preventDefault();
            const form = event.target;

            // Collect form data
            const name = form.name.value.trim();
            const email = form.email.value.trim();
            const message = form.message.value.trim();

            if (!name || !email || !message) {
                alert("All fields are required.");
                return;
            }

            try {
                // Send data to the server
                const response = await fetch("https://formspree.io/f/mpwqavlb", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ name, email, message }),
                });

                if (response.ok) {
                    alert("Details sent successfully!");
                    form.reset();
                } else {
                    const error = await response.text();
                    alert(`Failed to send message: ${error}`);
                }
            } catch (error) {
                console.error("Error sending message:", error);
                alert("An error occurred while sending the message. Please try again later.");
            }
        }
    </script>
</head>
<body>
    <div class="contact-form"  onsubmit="handleContactForm(event)">
        <h3>Enter Your Details</h3>
        <form id="order-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Your Email" required />

            <label for="message">Address:</label>
            <textarea id="message" name="message" placeholder="Your Address" rows="5" required></textarea>

            <input type="submit" value="Send" class="send">

    </div>
</body>
</html>
