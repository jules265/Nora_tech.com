<body>

    <script>
        let translated = false;
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");

        }
        function toggleTranslation() {
            const content = document.getElementById("content");
            const contents = document.getElementById("contents");
            const contentss = document.getElementById("contentss");
            if (!translated) {
                content.innerText = "Muganga w'Urubuga | Umuhanzi | Umukozi wigenga";
                contents.innerText = "Uwujuje Ibyangombwa mu Rwanda";
                contentss.innerText = "Munsure kurubuga rwanjye.";
                translated = true;
            } else {
                contents.innerText = "Full stack from Rwanda";
                content.innerText = "Web Developer | Designer | Freelancer";
                contentss.innerText = "Visit me on my website.";
                translated = false;
            }
        }
    </script>
