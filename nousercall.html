<head>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;

        /* Header Styles */
header {
    background-color: #333;
    color: white;
    padding: 15px 20px;
    text-align: center;
}
body::-webkit-scrollbar{
    display: none;
}
/* Navigation Menu */
.menu {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #444;
}

.menu li {
    position: relative;
    padding: 15px;
}

.menu li a {
    color: white;
    text-decoration: none;
    padding: 10px;
}

.menu li a:hover {
    background-color: #555;
    border-radius: 5px;
}

/* Dropdown Menu */
.dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background-color: #444;
    list-style: none;
    padding: 0;
    margin: 0;
    min-width: 180px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    border-radius: 5px;
}

.dropdown-menu li {
    padding: 10px;
}

.dropdown-menu li a {
    color: white;
    display: block;
    text-decoration: none;
}

.dropdown-menu li a:hover {
    background-color: #666;
}

.dropdown:hover .dropdown-menu {
    display: block;
}

/* Search Bar */
#search {
    padding: 8px;
    border: none;
    border-radius: 5px;
    margin-right: 5px;
}

button {
    padding: 8px 12px;
    background-color: #555;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #777;
}

/* Shopping Cart Icon */
#cart-icon {
    font-size: 18px;
    padding: 10px;
    color: white;
    text-decoration: none;
}

#cart-icon:hover {
    color: #ffcc00;
}

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            text-align: center;
        }
        h3{
            
          padding: 20px 30px;
        
        }
        .contact-form input, .contact-form textarea {
            width: 97%;
            padding: 10px;
            margin: 10px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .contact-form{
            width: 98%;
            background-color: #fff;
        }
        label{
            padding: 5px 10px;
        }
        .contact-form input:focus{
            box-shadow: 0 0 4px blue;
            outline: none;
            border:1px solid blue;
        }
        .contact-form textarea{
            outline: #218838;
        }
        .send {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            width: 100%;
            border-radius: 5px;
        }
        .send:hover{
            background-color: #2faf4b;
        }
        footer {
    background-color: #222;
    color: #fff;
    text-align: center;
    padding: 15px;
    font-size: 14px;

    bottom: 0;
    width: 100%;
}

footer a {
    color: #ff9800;
    text-decoration: none;
    font-weight: bold;
}

footer a:hover {
    text-decoration: underline;
}

    </style>
        <script src="https://widget.cxgenie.ai/widget.js" data-aid="3364223f-7584-4c38-9282-9819b65cfd7e"
		
        data-lang="en"></script>
    <script>
        
        async function handleContactForm(event) {
            event.preventDefault();
            const form = event.target;

            // Collect form data
            const name = form.name.value.trim();
            const email = form.email.value.trim();
            const message = form.message.value.trim();

            if (!name || !email || !message) {
                alert("All fields are required.");
                return;
            }

            try {
                // Send data to the server
                const response = await fetch("https://formspree.io/f/mpwqavlb", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ name, email, message }),
                });

                if (response.ok) {
                    alert("Details sent successfully!");
                    form.reset();
                } else {
                    const error = await response.text();
                    alert(`Failed to send message: ${error}`);
                }
            } catch (error) {
                console.error("Error sending message:", error);
                alert("An error occurred while sending the message. Please try again later.");
            }
        }
    </script>
</head>

    <header>
        <h1>Nora-Tech</h1>

            </ul>
        </nav>

    <div class="contact-form"  onsubmit="handleContactForm(event)">
        <h3>Enter Your Details</h3>
        <form id="order-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your Name" required />

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Your Email" required />

            <label for="message">Address:</label>
            <textarea id="message" name="message" placeholder="Your Address" rows="5" required></textarea>

            <input type="submit" value="Send" class="send">

    </div>
